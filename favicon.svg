<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="艾欧泽亚放置">
  <title>艾欧泽亚放置</title>
  <!--
    浏览器标签页用的小图标：**去掉底色**，只留水晶。
    因为标签栏可能是浅色也可能是深色，带底色的方块在浅色标签栏上会显得很脏；
    透明底 + 金色描边在两种主题下都成立。
  -->
  <defs>
    <linearGradient id="gem" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#f6e6b4"/>
      <stop offset="0.45" stop-color="#d8b76a"/>
      <stop offset="1" stop-color="#9c7c34"/>
    </linearGradient>
  </defs>
  <path d="M256 60 L152 200 L176 316 L256 452 L336 316 L360 200 Z"
        fill="url(#gem)" stroke="#8a7440" stroke-width="10" stroke-linejoin="round"/>
  <path d="M256 60 L152 200 L176 316 L256 452 Z" fill="#ffffff" fill-opacity=".22"/>
  <path d="M256 60 L360 200 L336 316 L256 452 Z" fill="#000000" fill-opacity=".20"/>
  <path d="M256 66 L256 446" stroke="#ffffff" stroke-opacity=".30" stroke-width="6"/>
</svg>
