<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="艾欧泽亚放置">
  <title>艾欧泽亚放置 · FF14 Idle</title>
  <!--
    本项目自绘的标识：一块几何水晶 + 地平线上的破晓弧。
    全部由直线/弧线手工构成，没有任何外部素材（见 docs/07-data-sources-licensing.md）。
    配色沿用游戏内 UI 的深蓝黑 + 金色。

    设计约束（改之前先看一眼）：
      · Android 的 maskable 图标会把四周裁掉一圈，所以水晶必须待在中心 80% 以内；
      · 手机壁纸常常是深色，底色太黑会和壁纸糊在一起，所以背景要有一层偏蓝的微光。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2a3552"/>
      <stop offset="0.55" stop-color="#161c2b"/>
      <stop offset="1" stop-color="#0b0e15"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.44" r="0.52">
      <stop offset="0" stop-color="#e8cf8e" stop-opacity=".40"/>
      <stop offset="1" stop-color="#e8cf8e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gem" x1="0.25" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#fbf0cd"/>
      <stop offset="0.42" stop-color="#dfbd6e"/>
      <stop offset="1" stop-color="#9a7a33"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <ellipse cx="256" cy="238" rx="196" ry="204" fill="url(#glow)"/>

  <!-- 破晓弧：地平线上一道日出 -->
  <path d="M104 386 A 168 168 0 0 1 408 386" fill="none" stroke="#d8b76a" stroke-opacity=".45"
        stroke-width="10" stroke-linecap="round"/>
  <path d="M162 386 A 110 110 0 0 1 350 386" fill="none" stroke="#d8b76a" stroke-opacity=".22"
        stroke-width="7" stroke-linecap="round"/>

  <!-- 水晶本体：瘦长六棱，尖端朝上 -->
  <path d="M256 84 L176 202 L196 308 L256 424 L316 308 L336 202 Z"
        fill="url(#gem)" stroke="#f7e7b6" stroke-width="7" stroke-linejoin="round"/>
  <!-- 左亮面 / 右暗面，做出体积 -->
  <path d="M256 84 L176 202 L196 308 L256 424 Z" fill="#ffffff" fill-opacity=".22"/>
  <path d="M256 84 L336 202 L316 308 L256 424 Z" fill="#000000" fill-opacity=".24"/>
  <!-- 中轴棱线 -->
  <path d="M256 90 L256 418" stroke="#ffffff" stroke-opacity=".36" stroke-width="4"/>
  <!-- 高光条 -->
  <path d="M228 128 L246 142 L222 300 L206 284 Z" fill="#ffffff" fill-opacity=".40"/>
</svg>
